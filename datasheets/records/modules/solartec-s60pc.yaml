  notes: >-
    Datasheet supplied by the owner. Bilingual English/Spanish datasheet; the values come from the
    English column. The NOCT column is exactly 0.8 x the STC row for every model (for example
    S60PC-240: Voc 28.54 V = 0.8 x 35.70 V, Vmp 24.00 V = 0.8 x 30.00 V, Imp 6.40 A = 0.8 x 8.00 A,
    Pmax 192 W = 0.8 x 240 W), so Vmp x Imp = 153.6 W does not match the printed Pmax 192 W. The
    NOCT electrical values are not physically consistent and are left out of the variants; noct_c
    keeps the printed 45±2 °C. Module thickness is not printed as such; dimensions_mm keeps the
    40 mm aluminium frame height as the third value. Power tolerance is printed as "Warranted
    Tolerance +3%" and recorded as 0 to +3 %. The datasheet's STC note reads 20 °C and AM 1.6,
    apparently a typo for 25 °C and AM 1.5; the STC values are recorded as printed. Values were
    read from the text layer and confirmed on the rendered page images (pages 1-2).
