  notes: >-
    This V19 sheet (2023-09-26) is the most recent official LR5-54HTH datasheet on LONGi's own
    domain; it is branded "Hi-MO X6" although the queue issue calls the series "Hi-MO 6": LONGi
    renamed the family and the module codes are unchanged. The sheet covers the Explorer bins
    420~440M; the Scientist bins (445~455M) have a separate datasheet and are not printed in this
    table, so this record holds only the five Explorer power levels. The sheet is monofacial
    (single glass), the issue asks for the IEC monofacial version. The datasheet does not print a
    cell technology on its two pages; cell_type keeps what the datasheet prints (the M suffix means mono-crystalline;
    reviewer correction: a product page is not a source for the record). The sheet prints "DC1500V (IEC/UL)"; the
    record keeps the IEC 1500 V. The NOCT row (45±2°C) is printed as NOCT.
