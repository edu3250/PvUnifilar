  notes: >-
    The printed footer dates this Explorer V19 sheet 2023-09-26, later than the printed date of the
    official Scientist LR5-72HTH 590~600M sheet (20230811V19), so this is the most recent official
    LR5-72HTH datasheet on LONGi's own domain and it holds the IEC monofacial version the issue
    asks for. The sheet is branded "Hi-MO X6" although the queue issue calls the series "Hi-MO 6":
    LONGi renamed the family and the module codes are unchanged. The sheet covers the Explorer bins
    565~585M; the Scientist bins (590~600M) have a separate datasheet and are not printed in this
    table, so this record holds only the five Explorer power levels. The datasheet does not print a
    cell technology on its two pages; the modules use LONGi's HPBC back-contact mono-crystalline
    cells per the manufacturer's Hi-MO X6 product page. The sheet prints "DC1500V (IEC/UL)"; the
    record keeps the IEC 1500 V. The NOCT row (45±2°C) is printed as NOCT.
