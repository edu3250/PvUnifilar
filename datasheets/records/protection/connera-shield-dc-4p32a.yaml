  notes: >-
    The owner provided the PDF on 2026-11-03 (also received as Desconectador_tencica.pdf, the same file). Values read
    from the rendered pages (the text layer scrambles the tables). The datasheet does not publish a utilization category
    (DC-PV1/DC-PV2), a rated insulation voltage or the standards; the owner chose to load the record with those fields
    empty, so the responsible engineer must confirm them with the distributor. Rated voltage 1000 Vcd (-10) and
    1200 Vcd (-12), rated current 32 A, taken as the enclosed thermal current: the 40 A and 50 A rows are capped to it
    by the engine. The -12 table lists rows at 1500 V above its 1200 Vcd rating; they are kept as printed. Model -10
    also offers type 2H (one string, two breaks per pole: 300 V and 500 V, 40 A) and type 4S (one string, 32 A up to
    1000 V); both use all four poles and their values are covered by the 4B rows. Temperature range -40 to 85 °C
    (not stated as operating or storage), IP66, power 20 kW max, mechanical 20000 / electrical 2000 operations,
    grounding terminals only on -10, lockable with a padlock, vertical or horizontal mounting.
