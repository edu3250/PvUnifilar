  notes: >-
    The owner provided the PDF on 2026-11-03 and asked to load every version. Pages 1-3 are Portuguese, 4-6 the same
    sheet in Spanish; values read from the rendered Spanish pages (the text layer scrambles the tables). iscpv_ka is
    the "Máxima corriente de corto sin fusible de respaldo" (5 kA), with a 16 A gPV backup fuse. Up is the printed
    maximum ("< 1,0 kV" ... "< 5,0 kV"). Note 3 of the sheet: the 10 kA versions are not certified (certified: false).
    Remote-signalling versions (/SR) weigh about 6 g more and add a 120 Vac / 24 Vdc 1 A contact. The 1100 V version
    has no complete-device code: the code list gives only the base 017445 and the plug 016257, and no /SR version.
    A second 1040 V 18 kA row lists only the plug 020105; it is not a separate version and is left out.
