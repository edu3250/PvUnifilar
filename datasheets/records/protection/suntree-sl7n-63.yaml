  notes: >-
    Updated 2026-11-03 from the newer catalogue pages the owner provided (the distributor's sheet for the 2P 32 A
    version, Suntree pages 17-22); the first record (2026-10-07) came from the brochure DC-MCB-SL7N-63.pdf (sha256
    2695d068dcc4683853d37c58b7be253320252e507ed095721a4c7d0571d2a699). Values read from the rendered pages. The newer
    sheet changes: Ue options per pole count (adds 24/48 V on 1P and 2P, 500 V on 2P; 3P is 750/900 V; 4P is
    1000/1200 V), mechanical life 20000 and electrical life 10000 (<=DC125V/1P, <=DC250V/2P) or 1500, certificates
    CE, IEC, CB, TUV. Breaking capacity "Ics = Icu = 6kA (2P 800V 4P1200V) 2kA" is read as 6 kA, except 2 kA at
    2P 800 V and 4P 1200 V: the earlier record had it the other way round; the lower value at the highest voltages is
    the physically consistent reading. PV string fault currents are far below 2 kA, so no PV design changes. The
    standards row prints "IEC 60749-2", a misprint of IEC 60947-2 (the tripping curves cite IEC/EN 60947-2). The
    instantaneous trip "10 x In" comes from a marking on the product images of the first brochure; the newer sheet
    gives B curve 3-5 In and C curve 5-10 In. Order example: "SL7N-63 2P DC550V 32A".
