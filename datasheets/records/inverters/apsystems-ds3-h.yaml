  notes: >-
    The owner provided the PDF on 2026-11-08 and confirmed the values and decisions the same day. The output is
    printed only at 240 V ("Nominal Output Voltage/Range 240V/211V-264V", "Nominal Output Current 4.4A",
    1050 / 240 = 4.375 A); the 220 V of the 2F-3H service is inside the range, and the owner decided to record the
    current at 220 V, 1050 W / 220 V = 4.77 A (deduced, conservative), hence max_ac_current_reference_voltage_v
    220. Owner criterion A: only the real power is printed ("Maximum Continuous Output Power 1050W") with a power
    factor > 0.99, so max_apparent_power_va = rated_ac_power_w. Owner criterion B: "AC Bus Cable 10AWG(35A) /
    12AWG(28A)" gives cable ampacities, not a largest branch breaker, so the trunk cables carry no max_ocpd_a and the
    NOM 240-4(d) limit applies. No start voltage is printed (startup_voltage_v left out). The recommended module
    power is printed "330Wp-660Wp+". Peak efficiency 97.3 %, CEC 97 %. Frequency range 59.3-60.5 Hz. Storage
    -40 to +85 °C. Up to 80 inverters per ECU recommended. Compliance: UL1741 (IEEE1547); CSA C22.2 No. 107.1-16;
    NOM-001; NEC 2014/2017/2020 section 690.12 rapid shutdown. Warranty 12 years standard, 25 optional.
