  notes: >-
    The owner provided the PDF on 2026-11-07 (to show that two strings per MPPT input fit a commercial inverter) and
    asked to add it; the engine does not design three-phase services yet, so the record is not selectable for a design
    until that support exists. Values from the PDF text layer, checked against the rendered page. The datasheet prints
    the rated output current (39.4 / 52.5 / 60.4 A, S = sqrt(3) x 220 V x I) and the maximum output current
    (43.3 / 57.7 / 65 A); the maximum current matches the apparent power at about 200 V (220 V - 10 %), so
    max_ac_current_reference_voltage_v is 200 V by that calculation, not a printed value. "Monitoreo fallas a tierra"
    is recorded as insulation monitoring. Enclosure "TYPE 4X" is a NEMA/UL type, not an IP code. PID recovery is
    optional. Compliance: UL 1741, IEEE 1547, UL 1699B, UL 1998, FCC, UL 1741SA. Relative humidity 0-100 %,
    redundant smart fan cooling, LCD, RS485 (Wi-Fi/GPRS optional), AC connection by OT terminal.
