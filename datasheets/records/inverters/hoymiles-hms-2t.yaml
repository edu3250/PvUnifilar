  notes: >-
    The owner provided the PDF on 2026-11-08. Values read from the rendered page 2. Owner criteria of 2026-11-08:
    (A) the datasheet gives only the apparent power ("Alimentación nominal de salida (VA)") with a default power
    factor > 0.99, so rated_ac_power_w = max_apparent_power_va (deduced, not printed); (B) no largest branch breaker
    is printed, so trunk_cables carry no max_ocpd_a and the NOM 240-4(d) limit applies alone; (C) the units per
    branch change with the AC voltage (HMS-800: 8/9/9 on 10 AWG and 5/5/6 on 12 AWG at 220/230/240 V), the record
    keeps the 220 V column. The output current is printed as "Corriente nominal de salida" (3.64 / 3.48 / 3.33 A
    at 220 / 230 / 240 V for the HMS-800) and matches VA / V; it is used as the continuous output current of NOM
    690-8(a)(3). The efficiency is the "Eficiencia pico de la Comisión de Energía de California (CEC)" 96.5 %,
    stored as max_efficiency_pct. The recommended module power is printed "320 a +500" ("Módulo de potencia de uso
    común"). Frequency 50/45-55 or 60/55-65 Hz. Compliance: UL 1741, ABNT NBR 16150:2013, ABNT NBR 16149:2013.
    Monitoring: Hoymiles S-Miles Cloud (DTU gateway). Rapid shutdown and an isolated transformer per the first page.
