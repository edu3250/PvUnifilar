  notes: >-
    The owner provided the PDF on 2026-11-08. Values read from the rendered page 2. A 120 V model ("Voltaje de
    salida nominal/Rango 120V/105-132V"), so it works on the 127 V phase-to-neutral service (1F-2H). The current is
    printed at 120 V (7.5 A = 900 VA / 120 V); at 127 V the same power needs 7.09 A, so the printed value is the
    conservative one and is kept. Owner criterion A: "Potencia de salida continua máxima 900VA" with a fixed power
    factor > 0.99, so rated_ac_power_w = 900 (deduced). Owner criterion B: the AC bus cable figures (35 A, 28 A) are
    cable ampacities, not a largest breaker. No start voltage is printed. The recommended module power is printed
    "330Wp-660Wp+" (the first page says "módulos de hasta 670 W+"). Maximum efficiency 95.7 %. Frequency
    59.3-60.5 Hz. Storage -40 to +85 °C. Up to 80 inverters per ECU. Compliance: UL1741 (IEEE1547); CSA C22.2
    No. 107.1-16; NOM-001; NEC 2014/2017/2020 section 690.12 rapid shutdown. Warranty 12 years, 25 optional.
