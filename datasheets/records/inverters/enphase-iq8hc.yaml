  notes: >-
    The owner provided the PDF (Mexico edition) on 2026-11-08, after the installation manual showed that only the
    IQ8HC is compatible with the 220 V grid in Mexico (manual sections 2.3 and 2.4; the IQ8MC and IQ8AC are "NA" at
    220 V and were not loaded). Values read from the rendered pages. Owner criterion C: the 220 V column
    ("220, monofásico/trifásico (L-L), 120°": grid range 198-264 V, maximum continuous output current 1.73 A,
    9 units per 20 A branch, maximum efficiency 97.21 %, CEC 96.50 %); the 240 V split-phase column gives
    211-264 V, 1.58 A, 10 units, 97.31 %. Owner criterion A: rated_ac_power_w is the maximum continuous output
    power 380 VA (power factor setting 1.0); the peak output power is 384 VA. The input lists two short-circuit
    limits: "Máxima Isc del módulo" 20 A (the module compatibility limit, used by MIC-002) and "Máxima corriente
    de corto circuito en CC de entrada" 25 A. The trunk is the IQ Cable, "un cable 12 AWG de longitud continua"
    (page 4), and the AC side requires "un máximo de 20 A por circuito derivado"; 1.25 x 9 x 1.73 A = 19.5 A, so
    the NOM limit and the manufacturer's coincide. Ungrounded array, no additional DC protection required, DC port
    backfeed 0 mA; AC short-circuit current over 3 cycles 2.70 A; overvoltage class DC II, AC III. Certifications
    include UL 1741-SA/SB, IEEE 1547:2018, UL 62109-1 and NOM-001-SCFI-2018; UL listed as PV rapid shutdown
    equipment. The manual recommends a total voltage rise below 2 % from the branch to the load centre breaker.
