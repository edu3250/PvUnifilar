  notes: >-
    The owner provided the PDF on 2026-11-07 to start microinverter support. Values from the PDF text layer,
    checked against the rendered page 2. The datasheet prints 2550 W rated AC power for the NEO 2250M-X2 but
    2250 VA apparent power and 10.23 A at 220 V (= 2250 VA); real power cannot exceed apparent power, so the
    record keeps 2250 W (owner decision 2026-11-07). The recommended module power is printed with a trailing
    "+" ("320W to 530W+"); the record keeps the printed numbers. The AC current is also printed at 230 V and
    240 V (6.96 / 6.67 A for the 1600). trunk_cables, max_units_per_trunk, drop_cable_size and
    max_drop_cable_length_m come from section 4.4 of the installation manual ("Selection of the Over Current
    Protection Device and the Cable"), shared by the owner as a screenshot on 2026-11-07; the engine applies
    NOM 690-8(b) and 240-4(d) first and uses that table only as a cap (owner decision 2026-11-07).
    Compliance: CE, N4105, EN 50549-1, C10/C11, G98, IEEE 1547, UL 1741. Noise 25 dB(A), relative humidity
    0-100 %, natural convection, LED + app display, 12-year warranty.
