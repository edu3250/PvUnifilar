name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# The workflow only reads the repository: no token write scopes are needed.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package with dev tools
        run: pip install -e ".[dev,catalogue]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      # Tests marked "autocad" are skipped here: they need a licensed local AutoCAD 2027.
      - name: Test with coverage
        run: pytest --cov

  package:
    # The plugin's server is built by uvx from a git tag and runs without the repository
    # (Stage 3.6.4): build the wheel, start the server the way the plugin does, and design an
    # installation with the installed wheel from outside the checkout.
    name: package (${{ matrix.os }}, wheel without the repository)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Build the wheel
        run: uv build --wheel --out-dir "${{ runner.temp }}/dist"

      - name: Start the server as the plugin does
        run: uvx --python 3.12 --from . pvsld-mcp --version

      - name: Design with the installed wheel, outside the checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        run: >-
          uv run --no-project --python 3.12 --with "$(ls dist/pvsld-*.whl)"
          python -I "${{ github.workspace }}/scripts/smoke_installed.py"

  claude-plugin:
    # The PvUnifilar plugin and the pvsld marketplace (Stage 3.6.4b), checked by Claude Code's own
    # validator; --strict also fails on warnings such as unknown fields or missing metadata.
    name: Claude Code plugin (validate --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the plugin
        run: claude plugin validate --strict plugins/pv-unifilar

      - name: Validate the marketplace
        run: claude plugin validate --strict .

      # The repository is also a Gemini CLI extension (Stage 3.7): gemini-extension.json at the root.
      - name: Validate the Gemini CLI extension
        run: |
          npm install -g @google/gemini-cli
          gemini extensions validate .

  plugin:
    # The B2 plug-in compiles against Autodesk's reference assemblies from NuGet (AutoCAD.NET
    # 26.0.0, ExcludeAssets=runtime), so no AutoCAD is needed to build it. Only the AutoCAD-free
    # bridge assembly has unit tests here; the in-AutoCAD behaviour is covered by tests/autocad.
    name: plug-in (.NET 10 build and bridge tests)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build plugin/PvSld.AutoCAD.slnx -c Release

      - name: Test the bridge
        run: dotnet test plugin/PvSld.AutoCAD.slnx -c Release --no-build
